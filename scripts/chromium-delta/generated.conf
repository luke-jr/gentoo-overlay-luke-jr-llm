# Files of the Chromium tarball that are in no git repository and no CIPD/GCS dependency
# (tarball-generated.py): pattern (fnmatch, * also matches /), decision, reason.
# stamp: regenerate for the new version (stamps.py). omit: leave out of the upgrade patches.
build/util/LASTCHANGE	stamp	lastchange.py: the commit and its branch position
build/util/LASTCHANGE.committime	stamp	lastchange.py: the commit time
gpu/config/gpu_lists_version.h	stamp	lastchange.py -m GPU_LISTS_VERSION: the commit
skia/ext/skia_commit_hash.h	stamp	lastchange.py -m SKIA_COMMIT_HASH: Skia's revision (DEPS)
gpu/webgpu/DAWN_VERSION	stamp	lastchange.py -s third_party/dawn: Dawn's revision (DEPS)
gpu/webgpu/dawn_commit_hash.h	stamp	Dawn's revision (DEPS), like DAWN_VERSION
chrome/build/pgo_profiles/*	omit	Chrome's PGO profiles (update_pgo_profiles.py), unused: chrome_pgo_phase=0, or the ebuild's own profile with USE=pgo
v8/tools/builtins-pgo/profiles/*	omit	V8's builtins PGO profiles (download_profiles.py), unused: they need chrome_pgo_phase=2 and V8's external code space, which the ebuild turns off
tools/gn/*	omit	GN's source at DEPS' gn_version, added by export_tarball.py; the ebuild builds with dev-build/gn
chrome/test/data/webui/i18n_process_css_test.html	omit	an empty file the tarball scripts create for a test
build/config/gclient_args.gni	derived	gclient writes it from DEPS' gclient_gn_args (gn reads it): `deps.py changed` says when it changes, then regenerate it
.landmines	omit	a hook output (landmines.py), not read by the build
build/config/siso/*	omit	siso's configuration (a hook output), not used: the ebuild builds with ninja
chromeos/tast_control.gni	omit	a hook output for ChromeOS tests, not read by the Linux build
testing/location_tags.json	omit	a hook output (test result metadata), not read by the build
third_party/depot_tools/external_bin/*	omit	depot_tools' own downloads (gsutil), not used by the build
third_party/depot_tools/.versions/*	omit	depot_tools' own CIPD client version, not used by the build
